# app.sitepresso.com — prod unified-admin host. Proxies to the prod
# platform on port 3000. Specific server_name takes precedence over
# the *.sitepresso.com wildcard so this catches BEFORE traffic falls
# through to the tenant router on port 3099. Mirrors
# scripts/nginx-app-aapkatech.conf.
server {
    listen 80;
    server_name app.sitepresso.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.sitepresso.com;

    ssl_certificate     /etc/letsencrypt/live/sitepresso.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sitepresso.com/privkey.pem;

    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 30M;
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $http_connection;
    }
}
