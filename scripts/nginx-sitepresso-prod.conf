# Production: sitepresso.com → Docker compose ports.
# Mirrors staging now that prod runs the compose stack: platform 3000,
# backend 5000, router 3099, vertical leaf apps on 3001/3002/3003/etc.

# Platform → port 3000 (HTTP)
server {
    listen 80;
    server_name sitepresso.com www.sitepresso.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type "text/plain"; try_files $uri =404; }
    location / {
        limit_req zone=general burst=60 nodelay;
        limit_conn conn_limit 100;
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl http2;
    server_name sitepresso.com www.sitepresso.com;
    ssl_certificate /etc/letsencrypt/live/sitepresso.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sitepresso.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # /api/* hairpin fix — proxy directly to the backend on the loopback
    # interface instead of letting Next.js fetch through the public URL
    # (CrowdSec / Cloudflare drop the loopback HTTPS handshake). Mirrors
    # the staging fix in aapkatech-staging.
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 30M;
    }

    location / {
        limit_req zone=general burst=60 nodelay;
        limit_conn conn_limit 100;
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

