# Logrotate config for Sitepresso. Install on EC2 with:
#   sudo cp scripts/logrotate-sitepresso.conf /etc/logrotate.d/sitepresso
#   sudo logrotate -d /etc/logrotate.d/sitepresso   # dry-run
#   sudo logrotate -f /etc/logrotate.d/sitepresso   # force-run once to verify
#
# Default logrotate cron (/etc/cron.daily/logrotate) picks this up.

# Application logs from PM2-managed Node processes (backend + platform + business).
# PM2 puts logs in ~/.pm2/logs/<app>-out-N.log and -error-N.log.
# `su ubuntu ubuntu` tells logrotate to drop privileges to the ubuntu user
# before operating in a user-owned directory — without it, root logrotate
# refuses to touch the world-writable parent directory (security feature).
/home/ubuntu/.pm2/logs/sitepresso-*.log {
    su ubuntu ubuntu
    daily
    rotate 90
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    # PM2 holds open file descriptors to the log files. copytruncate
    # writes a copy then truncates the original in place, so PM2 keeps
    # writing to the same fd and we don't need a reload.
    create 0644 ubuntu ubuntu
}

# Auto-deploy log (in ubuntu's home dir → same su requirement)
/home/ubuntu/sitepresso-autodeploy.log {
    su ubuntu ubuntu
    weekly
    rotate 12
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    create 0644 ubuntu ubuntu
}

# DB backup script log (in ubuntu's home dir → same su requirement)
/home/ubuntu/db-backup.log {
    su ubuntu ubuntu
    weekly
    rotate 12
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    create 0644 ubuntu ubuntu
}

# nginx access + error logs are managed by Ubuntu's stock /etc/logrotate.d/nginx
# config (14 days by default). Bumped to 90 days to match the Sitepresso
# Privacy Policy retention statement.
/var/log/nginx/*.log {
    daily
    rotate 90
    compress
    delaycompress
    missingok
    notifempty
    sharedscripts
    create 0640 www-data adm
    postrotate
        [ ! -f /var/run/nginx.pid ] || kill -USR1 `cat /var/run/nginx.pid`
    endscript
}
