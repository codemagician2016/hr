# Tenant storefronts (any other subdomain) → router app port 3099 (HTTP)
# The router reads vertical:{slug} from Redis (or falls back to backend API)
# and proxies to the correct sub-app port (booking 3001, shop 3002, web 3003,
# admin/staff/customer on 3011-3033).
server {
    listen 80;
    server_name *.aapkatech.com;
    location / {
        limit_req zone=general burst=60 nodelay;
        limit_conn conn_limit 100;
        proxy_pass http://localhost:3099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

