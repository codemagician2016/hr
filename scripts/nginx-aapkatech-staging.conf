# Platform → port 3000 (HTTP)
server {
    listen 80;
    server_name aapkatech.com www.aapkatech.com;
    location / {
        limit_req zone=general burst=60 nodelay;
        limit_conn conn_limit 100;
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Platform → port 3000 (HTTPS)
server {
    listen 443 ssl http2;
    server_name aapkatech.com www.aapkatech.com;

    ssl_certificate /etc/letsencrypt/live/aapkatech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aapkatech.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # /api/* hairpin fix — proxy directly to the backend on the loopback
    # interface instead of letting Next.js fetch through the public URL
    # (CrowdSec / Cloudflare drop the loopback HTTPS handshake). Mirrors
    # the pattern already in scripts/nginx-app-aapkatech.conf.
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 30M;
    }

    location / {
        limit_req zone=general burst=60 nodelay;
        limit_conn conn_limit 100;
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

