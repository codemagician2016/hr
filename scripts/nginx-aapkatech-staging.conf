# Super-admin console → platform app on port 3000 (staging). Must come
# before the *.aapkatech.com wildcard. Added 2026-04-29.
server {
    listen 80;
    server_name admin.aapkatech.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type "text/plain"; try_files $uri =404; }
    location / {
        limit_req zone=general burst=60 nodelay;
        limit_conn conn_limit 100;
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
