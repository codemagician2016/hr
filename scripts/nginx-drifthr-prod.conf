# Production: drifthr.com — direct-origin nginx (the alternative to the
# cloudflared tunnel; use ONE). nginx terminates TLS and proxies EVERY host to
# the edge router on :3099, which then host-routes to platform / hr-admin / ess /
# backend. This single-upstream design is what lets tenant custom domains work
# via Cloudflare-for-SaaS: any bound domain that reaches the box is resolved by
# the router from the Host header (forwarded below as X-Tenant-Host).
#
# Install:
#   sudo cp scripts/nginx-drifthr-prod.conf /etc/nginx/sites-available/drifthr.conf
#   sudo ln -sf /etc/nginx/sites-available/drifthr.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: apex/www/app/admin + *.drifthr.com use the drifthr.com cert (provision the
# wildcard via certbot DNS-01 or Cloudflare origin cert). Bound custom domains are
# terminated at Cloudflare's edge (Cloudflare-for-SaaS), so the default_server
# block below only needs a cert that nginx will accept for the TLS handshake from
# Cloudflare — the same wildcard cert is fine since CF re-encrypts to origin.

# Rate-limit + connection zones (define once, here).
limit_req_zone  $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=api:10m     rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Everything proxies to the edge router.
upstream drifthr_router {
    server 127.0.0.1:3099;
    keepalive 64;
}

# gzip (lean, text-only).
gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_types text/plain text/css application/json application/javascript
           application/xml text/xml image/svg+xml application/rss+xml;

# Shared proxy behaviour: pass the true Host + X-Forwarded-* so the router and
# the backend can rebuild URLs, resolve tenants, and trust the TLS scheme. The
# router reads X-Tenant-Host to map bound custom domains to a tenant.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# ── HTTP → HTTPS for all DriftHR hosts (keep ACME challenge reachable) ──
server {
    listen 80;
    listen [::]:80;
    server_name drifthr.com www.drifthr.com app.drifthr.com admin.drifthr.com *.drifthr.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type "text/plain"; try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

# ── Apex + www + app + admin + every *.drifthr.com tenant subdomain ──
# One block: the router decides which surface each Host gets, so nginx does not
# need per-subdomain blocks. The wildcard cert covers all of these names.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name drifthr.com www.drifthr.com app.drifthr.com admin.drifthr.com *.drifthr.com;

    ssl_certificate     /etc/letsencrypt/live/drifthr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drifthr.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    # Security headers (lean baseline; HSTS only on the apex TLS edge).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        limit_req  zone=general burst=60 nodelay;
        limit_conn conn_limit 100;
        proxy_pass http://drifthr_router;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Tenant-Host     $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# ── Bound tenant CUSTOM DOMAINS (default_server) ──
# Any Host that is NOT a *.drifthr.com name lands here. The router resolves the
# tenant from X-Tenant-Host (backend /api/internal/domain-route) and serves ESS,
# or returns the "no site connected" 404. TLS for these is normally terminated
# at Cloudflare-for-SaaS; this block handles direct/origin hits and CF re-encrypt.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/drifthr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drifthr.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        limit_req  zone=general burst=60 nodelay;
        limit_conn conn_limit 100;
        proxy_pass http://drifthr_router;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Tenant-Host     $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# Plain-HTTP default_server for custom domains (CF origin pulls may be http).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type "text/plain"; try_files $uri =404; }
    location / {
        proxy_pass http://drifthr_router;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Tenant-Host     $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}
