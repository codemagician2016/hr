# nginx security hardening — drop into /etc/nginx/conf.d/sitepresso-hardening.conf
# Apply with:
#   sudo cp scripts/nginx-hardening.conf /etc/nginx/conf.d/sitepresso-hardening.conf
#   sudo nginx -t                       # validate config
#   sudo systemctl reload nginx          # pick up the new config
#
# This file lives at the http {} level (because of conf.d/ inclusion),
# so directives apply to every server block. They can be overridden in
# individual server blocks if needed.

# Hide the nginx version in the Server: header (e.g. "nginx/1.24.0" → "nginx").
# Doesn't stop a determined attacker but makes scanners' jobs marginally
# harder and removes a free vulnerability-fingerprint signal.
server_tokens off;

# Security headers applied to every response from every server block.
# These are defaults — an individual server block can override (for
# example, adding a stricter Content-Security-Policy for the storefront).

# Browser MIME-sniff protection. Stops Chrome/Firefox treating a non-HTML
# response as HTML based on contents (an old XSS vector).
add_header X-Content-Type-Options "nosniff" always;

# Click-jacking protection via CSP frame-ancestors (modern replacement
# for X-Frame-Options).
#
# The admin website-editor needs to embed each tenant's storefront as an
# iframe on a *different* subdomain (admin runs on www.<platform>, the
# preview iframe is at <slug>.<platform>). SAMEORIGIN was wrong here —
# different subdomains aren't same-origin and the iframe got blocked,
# breaking the website editor's live preview canvas (fixed 2026-04-29).
#
# frame-ancestors restricts which origins can embed our pages. We allow:
#   - https://*.sitepresso.com + apex  (prod)
#   - https://*.aapkatech.com  + apex  (staging)
# Everything else is implicitly denied (CSP default).
add_header Content-Security-Policy "frame-ancestors https://*.sitepresso.com https://sitepresso.com https://*.aapkatech.com https://aapkatech.com;" always;

# Referrer policy — strip referrer to other origins so we don't leak
# tenant slugs in third-party logs.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions policy — disable features we don't use. Reduces the API
# surface a compromised browser tab can abuse from sitepresso pages.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), bluetooth=()" always;

# HSTS — tell browsers to only ever use HTTPS for sitepresso.com (and
# subdomains) for the next year. Once enabled, downgrading from HTTPS
# back to HTTP becomes painful — only ship this when you're committed.
# Conservative settings: 6-month max-age, includeSubDomains, preload-ready
# (you can submit to hstspreload.org once you're confident).
add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

# Cross-origin isolation. Don't enable Cross-Origin-Embedder-Policy
# unless you've audited every script you embed — it breaks PostHog,
# Cloudflare Turnstile, and many third-party widgets.

# Limit the request size to avoid memory-exhaustion attacks on file
# uploads. 10 MB is plenty for product images / logos. Bump in a
# specific server block if you ever need bigger uploads.
client_max_body_size 10M;

# Refuse oversize headers — common bot probe + CRLF-injection vector.
large_client_header_buffers 4 8k;

# Reasonable read/write timeouts. Defaults are fine for most cases;
# explicit values stop slowloris-style slow-body attacks.
client_body_timeout 12s;
client_header_timeout 12s;
keepalive_timeout 15s;
send_timeout 10s;
