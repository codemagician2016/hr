# app.aapkatech.com — unified admin domain (BUSINESS_ADMIN + STAFF login).
# Routes to the platform Next.js app on port 3010.
#
# Specific server_name takes precedence over the *.aapkatech.com wildcard
# so this catches BEFORE traffic falls through to the tenant-storefront block.
#
# Install on the EC2:
#   sudo cp /home/ubuntu/sitepresso/scripts/nginx-app-aapkatech.conf /etc/nginx/sites-available/app.aapkatech
#   sudo ln -sf /etc/nginx/sites-available/app.aapkatech /etc/nginx/sites-enabled/app.aapkatech
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name app.aapkatech.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.aapkatech.com;

    # Reuse the existing wildcard cert that already covers *.aapkatech.com
    ssl_certificate     /etc/letsencrypt/live/aapkatech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aapkatech.com/privkey.pem;

    include /etc/nginx/conf.d/sitepresso-hardening.conf;

    # API requests go DIRECTLY to backend (port 5000) — bypasses the
    # Next.js rewrite proxy entirely, matching how aapkatech.com handles
    # /api/*. Without this block, requests to app.aapkatech.com/api/*
    # would hit platform Next.js → its /api/* rewrite → which times out
    # under hairpin/CrowdSec when the rewrite tries the public URL.
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $http_connection;
    }
}
